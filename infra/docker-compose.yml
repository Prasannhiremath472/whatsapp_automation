# Local development services. The API uses MySQL (the target hosting only
# supports MySQL) and Redis (BullMQ queues). Ports are offset from the
# defaults so these never collide with a MySQL/Redis already on your machine.
services:
  mysql:
    image: mysql:8.0
    container_name: whatsapp_crm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: whatsapp_crm_dev
      MYSQL_USER: genie
      MYSQL_PASSWORD: genie
      MYSQL_ROOT_PASSWORD: genie_root
    ports:
      - "3307:3306"
    volumes:
      - whatsapp_crm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pgenie_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: whatsapp_crm_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whatsapp_crm_mysql_data:
