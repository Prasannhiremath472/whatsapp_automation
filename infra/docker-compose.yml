# Local development services. The API needs only MySQL (the target hosting
# only supports MySQL; queues run inside the API process). The port is offset
# from the default so it never collides with a MySQL already on your machine.
services:
  mysql:
    image: mysql:8.0
    container_name: whatsapp_crm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: whatsapp_crm_dev
      MYSQL_USER: genie
      MYSQL_PASSWORD: genie
      MYSQL_ROOT_PASSWORD: genie_root
    ports:
      - "3307:3306"
    volumes:
      - whatsapp_crm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pgenie_root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  whatsapp_crm_mysql_data:
