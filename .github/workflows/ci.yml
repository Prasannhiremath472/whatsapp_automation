name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: whatsapp_crm_test
          MYSQL_USER: genie
          MYSQL_PASSWORD: genie
          MYSQL_ROOT_PASSWORD: genie_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pgenie_root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The e2e suites wipe every table: this is a throwaway CI database.
      DATABASE_URL: mysql://root:genie_root@localhost:3306/whatsapp_crm_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      PORT: 3000
      REDIS_URL: redis://localhost:6379
      VITE_API_BASE_URL: http://localhost:3000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma generate
        run: pnpm --filter @whatsapp-crm/api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter @whatsapp-crm/api exec prisma migrate deploy

      - name: API unit tests
        run: pnpm --filter @whatsapp-crm/api test

      - name: API e2e tests
        run: pnpm --filter @whatsapp-crm/api test:e2e

      - name: Web unit tests
        run: pnpm --filter @whatsapp-crm/web test

      - name: Build all packages/apps
        run: pnpm build
